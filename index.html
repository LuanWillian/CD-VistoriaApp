<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="Vistoria veicular em campo, com laudo em PDF e funcionamento offline.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CD Vistoria">
  <title>CD Vistoria</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/logo-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/logo-apple-180.png">
  <script src="modo-app.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/supabase-2.118.0.umd.js" defer></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topo">
    <p class="topo-titulo">CD Vistoria</p>
    <p class="status-rede" id="status-rede" data-estado="online" role="status" hidden>Online</p>
    <button type="button" class="btn-topo" id="btn-menu" aria-label="Menu" aria-haspopup="dialog" hidden>
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </header>

  <div class="faixa" id="faixa-versao" hidden>
    <p>Nova versão disponível.</p>
    <button type="button" class="btn btn-primario" id="btn-atualizar-versao">Atualizar</button>
  </div>
  <div class="faixa faixa-alerta" id="faixa-sessao" hidden>
    <p>Sua sessão expirou. Entre novamente para enviar as vistorias pendentes.</p>
    <button type="button" class="btn btn-primario" id="btn-entrar-sessao">Entrar</button>
  </div>
  <div class="faixa" id="faixa-instalar" hidden>
    <p id="faixa-instalar-texto">Instale o app para usar sem internet e abrir direto da tela inicial.</p>
    <button type="button" class="btn btn-primario" id="btn-instalar-faixa">Instalar app</button>
    <button type="button" class="btn btn-texto" id="btn-fechar-instalar">Agora não</button>
  </div>

  <main id="main" class="conteudo" tabindex="-1"></main>

  <div id="avisos" class="avisos" aria-live="polite"></div>
</body>
</html>
